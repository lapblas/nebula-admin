# 端口配置
server:
  port: 8081

# Spring配置
spring:
  application:
    name: nebula-admin
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/nebula?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: nebula
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms

# Sa-Token配置
sa-token:
  # token名称 (同时也是请求头名称)
  token-name: Authorization
  # token前缀
  token-prefix: "Bearer"
  # token有效期，单位秒，-1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期)，单位秒
  active-timeout: -1
  # 是否允许同一账号并发登录 (为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token)
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 是否从cookie中读取token
  is-read-cookie: false
  # 是否从header中读取token
  is-read-header: true
  # 是否从url中读取token
  is-read-url-query: false

# 日志拦截器配置
logging:
  level:
    com.nebula: INFO
  interceptor:
    # 统一开关，false 时所有日志都不打印
    enabled: true
    # 各部分开关
    # 基础信息（请求方式、URI、响应状态、耗时等）
    basic-info: true
    # 客户端信息（IP、UserAgent、Session ID）
    client-info: false
    # 请求头
    request-headers: false
    # 请求参数（URL 参数）
    request-params: true
    # 请求体（Body）
    request-body: true
    # 响应体
    response-body: true

# RSA配置
rsa:
  enable: false
  publicKey: 
  privateKey: 

# 管理员初始化配置
admin:
  init:
    enable: true
    username: admin
    password: admin123
    phone: "13800000000"